[project]
name = "fred-device"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "adafruit-blinka>=8.67.0",
    "adafruit-circuitpython-mcp3xxx>=1.4.22",
    "gpiozero>=2.0.1",
    "matplotlib>=3.10.7",
    "numpy>=2.2.4",
    "openai>=3.31.0",
    "opencv-python>=4.12.0.88",
    "pydantic-ai>=2.56.0",
    "pydantic-ai-harness>=0.56.0",
    "pyqt5>=5.15.11",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "rpi-gpio>=0.7.1",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
